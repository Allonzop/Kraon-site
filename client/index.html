<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>KRAON — Création de sites internet pour artisans</title>
    <meta name="description" content="KRAON crée des sites internet sur-mesure pour les artisans : une vitrine professionnelle, rapide et soignée, qui met votre savoir-faire en valeur et vous apporte des clients." />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KRAON" />
    <meta property="og:title" content="KRAON — Création de sites internet pour artisans" />
    <meta property="og:description" content="Des sites internet sur-mesure pour les artisans, qui mettent votre savoir-faire en valeur et vous apportent des clients." />
    <meta property="og:image" content="/assets/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KRAON — Création de sites internet pour artisans" />
    <meta name="twitter:description" content="Des sites internet sur-mesure pour les artisans, qui mettent votre savoir-faire en valeur." />
    <meta name="twitter:image" content="/assets/logo.png" />

    <!-- Fonts: only Inter is used across the site -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>

    <!--
      Formulaires détectés par Netlify au build. Les vrais formulaires (React)
      envoient leurs données en AJAX vers ces noms (voir lib/netlify-forms.ts).
      Ne pas supprimer : sans ces déclarations statiques, Netlify Forms ignore
      les soumissions d'une SPA.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="text" name="consent" />
      <input type="text" name="bot-field" />
    </form>
    <form name="audit" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="source" />
      <input type="text" name="score" />
      <input type="text" name="details" />
      <input type="text" name="consent" />
      <input type="text" name="bot-field" />
    </form>
    <form name="maquette" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="website" />
      <input type="text" name="sector" />
      <input type="text" name="consent" />
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="utm_term" />
      <input type="text" name="ref" />
      <input type="text" name="demo" />
      <input type="text" name="bot-field" />
    </form>
    <form name="commande" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="company" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="sector" />
      <input type="text" name="payment_option" />
      <input type="text" name="consent" />
      <input type="text" name="cgv" />
      <input type="text" name="cgv_version" />
      <input type="text" name="cgv_accepted_at" />
      <input type="text" name="utm_source" />
      <input type="text" name="utm_medium" />
      <input type="text" name="utm_campaign" />
      <input type="text" name="utm_content" />
      <input type="text" name="utm_term" />
      <input type="text" name="ref" />
      <input type="text" name="demo" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
