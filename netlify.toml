# Configuration de déploiement Netlify pour le site KRAON (frontend Vite/React).
# Le backend Express n'est PAS déployé ici : la capture de leads passe par
# Netlify Forms (formulaires "contact" et "audit" déclarés dans client/index.html).

[build]
  # Build du front, puis génération de sitemap.xml + robots.txt avec l'URL
  # réelle du site (variable Netlify `URL`) — voir scripts/gen-seo.mjs.
  command = "npx vite build && node scripts/gen-seo.mjs"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Repli SPA : toutes les routes client (wouter) servent index.html.
# Netlify traite les POST de formulaires avant cette règle, donc la capture reste OK.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Mise en cache. `/assets/*` ne contient que des fichiers générés par Vite avec
# une empreinte dans le nom (index-a1b2c3.js) : leur contenu ne change jamais
# pour une URL donnée, on peut donc les garder un an sans revalidation — les
# visiteurs qui reviennent ne retéléchargent plus rien.
# `/media/*` regroupe les médias fixes remplaçables (logo, portrait, vidéo du
# jeu) : cache court, pour qu'un remplacement soit visible rapidement.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
