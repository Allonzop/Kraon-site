# Configuration de déploiement Netlify pour le site KRAON (frontend Vite/React).
# Le backend Express n'est PAS déployé ici : la capture de leads passe par
# Netlify Forms (formulaires "contact" et "audit" déclarés dans client/index.html).

[build]
  # Build du front, puis génération de sitemap.xml + robots.txt avec l'URL
  # réelle du site (variable Netlify `URL`) — voir scripts/gen-seo.mjs.
  command = "npx vite build && node scripts/gen-seo.mjs"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# Repli SPA : toutes les routes client (wouter) servent index.html.
# Netlify traite les POST de formulaires avant cette règle, donc la capture reste OK.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
